name: MLOps CI Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install bandit pip-audit

      - name: Run Flake8 Linter
        run: flake8 src/ tests/

      - name: Run Pyright Type Checking
        run: pyright src

      - name: Static Security Check (Bandit)
        run: bandit -r src/ -ll --skip B101 || true

      - name: Dependency Vulnerability Check (pip-audit)
        run: pip-audit || true

      - name: Run Pytest + Coverage Quality Gate (95%)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Build Docker image
        run: docker build -t bankchurners .

      - name: Upload Coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
